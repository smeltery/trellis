name: Validate marketing site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
      - run: bun run --cwd apps/marketing typecheck
      - run: bun run build:marketing
      - name: Validate built public routes
        run: node fork/check-marketing.mjs
